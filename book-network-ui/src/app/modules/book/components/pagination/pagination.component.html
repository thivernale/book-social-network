@if (bookResponse.totalPages && bookResponse.totalPages > 1) {
  <div class="d-flex justify-content-center mt-3">
    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <li class="page-item">
          <a (click)="goToFirstPage()" [class.disabled]="page === 0" aria-label="First" class="page-link"
             href="javascript: void(0)">
            <i class="fas fa-angles-left"></i>
          </a>
        </li>
        <li class="page-item">
          <a (click)="goToPreviousPage()" [class.disabled]="page === 0" aria-label="Previous" class="page-link"
             href="javascript: void(0)">
            <i class="fas fa-angle-left"></i>
          </a>
        </li>
        @for (_ of [].constructor(bookResponse.totalPages); track $index; let pageIndex = $index) {
          <li [class.active]="page === pageIndex" class="page-item">
            @if (pageIndex !== page) {
              <a (click)="goToPage(pageIndex)" [attr.aria-label]="'Page ' + (pageIndex + 1)"
                 class="page-link" href="javascript: void(0)">
                {{ pageIndex + 1 }}
              </a>
            } @else {
              <span aria-current="page" class="page-link">{{ pageIndex + 1 }}</span>
            }
          </li>
        }
        <li class="page-item">
          <a (click)="goToNextPage()" [class.disabled]="isLastPage" aria-label="Next"
             class="page-link"
             href="javascript: void(0)">
            <i class="fas fa-angle-right"></i>
          </a>
        </li>
        <li class="page-item">
          <a (click)="goToLastPage()" [class.disabled]="isLastPage" aria-label="Last"
             class="page-link"
             href="javascript: void(0)">
            <i class="fas fa-angles-right"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
}
