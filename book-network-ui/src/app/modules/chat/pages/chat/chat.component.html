<div
  class="d-flex justify-content-center align-items-center min-vh-100 flex-column position-absolute w-100 top-0 z-n1">
  <div class="bg-body-secondary position-relative mt-5">
    chat-list works!
  </div>

  <div class="container d-flex mw-100 position-relative" style="width: 80%; height: calc(100vh - 100px);">
    <div class="d-flex flex-column justify-content-between align-items-center p-3 bg-body-secondary">
      <div><i class="fa-solid fa-message cursor-pointer"></i></div>
      <div class="d-flex flex-column align-items-center gap-2">
        <i class="fa-solid fa-user cursor-pointer"></i>
        <i class="fa-solid fa-door-open cursor-pointer"></i>
      </div>
    </div>
    <div class="d-flex w-100">
      <div class="col-md-6 col-xl-3 overflow-x-scroll">
        <app-channel-list [channelsInput]="channels()"></app-channel-list>
      </div>
    </div>
  </div>
</div>
