<div class="container-fluid card register-container">
  <h3 class="text-center">Create an account</h3>
  <hr/>
  <form (ngSubmit)="register()" #form="ngForm">
    @if (errorMsg.length) {
      <div class="alert alert-danger" role="alert">
        @for (msg of errorMsg; track msg) {
          <p>{{ msg }}</p>
        }
      </div>
    }
    <div class="mb-3">
      <label class="form-label" for="firstname">First name</label>
      <input [(ngModel)]="regRequest.firstname" class="form-control" name="firstname" id="firstname"
             placeholder="First name"
             type="text" required/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="lastname">Last name</label>
      <input [(ngModel)]="regRequest.lastname" class="form-control" name="lastname" id="lastname"
             placeholder="Last name"
             type="text" required/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="login">Email address</label>
      <input [(ngModel)]="regRequest.email" class="form-control" name="login" id="login" placeholder="name@example.com"
             type="email" required/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input [(ngModel)]="regRequest.password" class="form-control" name="password" id="password" placeholder="Password"
             type="password" required/>
    </div>
    <div class="d-flex justify-content-between mb-3">
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">
        <em class="fas fa-user-edit"></em>&nbsp;Create an account
      </button>
      <div class="align-bottom">
        Already have an account?&nbsp;
        <button (click)="login()" class="btn btn-link" type="button">
          Sign in
        </button>
      </div>
    </div>
  </form>
</div>
