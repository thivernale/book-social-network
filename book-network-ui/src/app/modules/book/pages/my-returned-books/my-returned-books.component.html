<h3>My Returned Books</h3>
<hr/>

<table class="table">
  <thead>
  <tr>
    <th scope="col">#</th>
    <th scope="col">Title</th>
    <th scope="col">Author</th>
    <th scope="col">ISBN</th>
    <th scope="col">Rate</th>
    <th scope="col"><i class="fas fa-cogs"></i></th>
  </tr>
  </thead>
  <tbody>
    @for (book of bookResponse.content; track $index; let i = $index) {
      <tr>
        <th scope="row">{{ i + 1 }}</th>
        <td>{{ book.title }}</td>
        <td>{{ book.authorName }}</td>
        <td>{{ book.isbn }}</td>
        <td><i class="fas fa-star text-warning"></i>{{ book.rate }}</td>
        <td>
          <div class="d-flex gap-2">
            <i
              [ngClass]="{ 'fa-regular text-primary': !book.returned, 'fa-solid text-success': book.returned }"
              class="fa-paper-plane"
            ></i>
            @if (book.returned && !book.returnApproved) {
              <i
                (click)="approveBookReturn(book)" (keydown.enter)="approveBookReturn(book)"
                aria-label="Approve return" class="fas fa-circle-check cursor-pointer" role="button" tabindex="0"
              ></i>
            } @else {
              <i [class.text-success]="book.returnApproved" class="fas fa-circle-check"></i>
            }
          </div>
        </td>
      </tr>
    }
  </tbody>
</table>

<app-pagination
  (pageChange)="page = $event; findAllReturnedBooks()"
  [bookResponse]="bookResponse"
  [page]="bookResponse.page ?? 0"
  [size]="size"
/>
