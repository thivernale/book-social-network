<h3>Book list</h3>
<hr/>

<div class="d-flex justify-content-start gap-2 flex-wrap">
  @for (book of bookResponse.content; track book.id) {
    <app-book-card
      (addToWaitingList)="addBookToWaitingList($event)"
      (borrow)="borrowBook($event)"
      (details)="showBookDetails($event)"
      [book]="book"
    />
  }
</div>

<app-pagination
  (pageChange)="page = $event; findAllBooks()"
  [bookResponse]="bookResponse"
  [page]="bookResponse.page ?? 0"
  [size]="size"
/>
