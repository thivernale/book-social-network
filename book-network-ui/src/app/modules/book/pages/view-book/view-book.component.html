<div class="p-2">
  <h2>Book Details</h2>
  <hr/>
  @if (errorMsg.length) {
    <div class="alert alert-danger mt-2" role="alert">
      @for (msg of errorMsg; track msg) {
        <p>{{ msg }}</p>
      }
    </div>
  }
  <div class="container">
    <div class="d-flex align-items-start gap-3">
      <div class="col-3">
        @if (selectedPicture) {
          <img [src]="selectedPicture" alt="" class="rounded-1" height="100%"
               width="100%">
        } @else {
          <div class="d-flex justify-content-center align-items-center h-100">
            <i class="fas fa-image" style="font-size: 144px"></i>
          </div>
        }
      </div>
      <div class="col-9 row align-items-start gap-3">
        <div class="col-12">
          <span class="fs-6 mb-1 text-secondary">Title: </span>
          {{ bookResponse.title }}
        </div>
        <div class="col-6">
          <span class="fs-6 mb-1 text-secondary">Author: </span>
          {{ bookResponse.authorName }}
        </div>
        <div class="col-4">
          <span class="fs-6 mb-1 text-secondary">ISBN: </span> {{ bookResponse.isbn }}
        </div>
        <div class="col-12">
          <span class="fs-6 mb-1 text-secondary">Synopsis: </span>
          {{ bookResponse.synopsis }}
        </div>
        <div class="col-12">
          <span class="fs-6 mb-1 text-secondary">Owner: </span> {{ bookResponse.owner }}
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end p-2">
      <button class="btn btn-link text-secondary" type="button" (click)="navigateToList()">
        <i class="fas fa-arrow-left"></i>&nbsp;Back to list
      </button>
    </div>
  </div>
</div>
