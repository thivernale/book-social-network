<div>
  @for (_ of [].constructor(fullStars); track $index) {
    <i class="fas fa-star text-warning"></i>
  }
  @if (hasPartialStar) {
    <i class="fas fa-star-half-alt text-warning"></i>
  }
  @for (_ of [].constructor(emptyStars); track $index) {
    <i class="fas fa-star text-secondary"></i>
  }
</div>
